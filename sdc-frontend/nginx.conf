server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mirrors the dev-time Vite proxy: /validate-sidecar → validator-service:3500/validate
    location /validate-sidecar {
        proxy_pass http://validator-service:3500/validate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        # 90s (validator's own VALIDATE_TIMEOUT_SECONDS) + 60s buffer, so Nginx never
        # cuts the connection before the validator's own timeout has a chance to
        # respond cleanly. The client itself gives up well before this (see
        # VALIDATE_CLIENT_TIMEOUT_MS in fhirClient.ts) — this backend-side timeout
        # is now just resource hygiene, not user-facing wait time.
        # proxy_connect_timeout / proxy_send_timeout stay at Nginx's 60s defaults
        # on purpose — a dead upstream or a stalled upload should still fail fast.
        proxy_read_timeout 150s;
    }

    # Mirrors the dev-time Vite proxy: /tx-fhir → https://tx.fhir.org/r4
    # Same-origin proxy sidesteps tx.fhir.org's duplicate CORS headers, which
    # Chromium rejects with "Failed to fetch" even on HTTP 200 (ADR-0062
    # amendment 2026-05-23). Added per ADR-0137 for the comorbidity typeahead.
    location /tx-fhir/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://tx.fhir.org/r4/;
        proxy_ssl_server_name on;
        proxy_set_header Host tx.fhir.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
