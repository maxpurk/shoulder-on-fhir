server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Terminology fallback: /tx/ -> the public FHIR terminology server. The
    # storage server cannot expand a value set defined by a SNOMED subsumption
    # filter, because it holds no SNOMED CodeSystem; a real terminology server
    # can. Kept server-side so the page stays same-origin.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    location /tx/ {
        proxy_pass https://tx.fhir.org/r4/;
        proxy_ssl_server_name on;
        proxy_set_header Host tx.fhir.org;
        proxy_set_header Accept application/fhir+json;
        proxy_read_timeout 60s;
    }

    # Pre-submission conformance gate: /validate-sidecar -> validator-service:3500/validate
    location /validate-sidecar {
        proxy_pass http://validator-service:3500/validate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
